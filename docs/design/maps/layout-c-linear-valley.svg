<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="Helvetica,Arial,sans-serif">
<rect width="1100" height="780" fill="#0a1410"/>
<text x="40" y="52" fill="#e6efe4" font-size="27" font-weight="700">方案 C · 河谷长带</text>
<text x="40" y="80" fill="#7d8f80" font-size="15">三段河谷，段与段之间是隘口。主路推进，支线可选。</text>
<path d="M90,268 Q220.0,232 350,268 L350,452 Q220.0,488 90,452 Z" fill="none" stroke="#8fbf7a" stroke-width="1.7" stroke-dasharray="7 6" opacity=".6"/><text x="220.0" y="220" fill="#8fbf7a" font-size="13" font-weight="600" text-anchor="middle">区域一</text><path d="M390,268 Q520.0,232 650,268 L650,452 Q520.0,488 390,452 Z" fill="none" stroke="#e0b45f" stroke-width="1.7" stroke-dasharray="7 6" opacity=".6"/><text x="520.0" y="220" fill="#e0b45f" font-size="13" font-weight="600" text-anchor="middle">区域二</text><path d="M690,268 Q825.0,232 960,268 L960,452 Q825.0,488 690,452 Z" fill="none" stroke="#d0604a" stroke-width="1.7" stroke-dasharray="7 6" opacity=".6"/><text x="825.0" y="220" fill="#d0604a" font-size="13" font-weight="600" text-anchor="middle">区域三</text><path d="M105,360 L945,360" stroke="#7d8f80" stroke-width="2.5" opacity=".45" stroke-dasharray="3 7"/><line x1="165" y1="360" x2="165" y2="308" stroke="#8fbf7a" stroke-width="1.6" opacity=".5"/><circle cx="165" cy="308" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="165" cy="308" r="7" fill="#8fbf7a" opacity=".55"/><line x1="255" y1="360" x2="255" y2="308" stroke="#8fbf7a" stroke-width="1.6" opacity=".5"/><circle cx="255" cy="308" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="255" cy="308" r="7" fill="#8fbf7a" opacity=".55"/><line x1="320" y1="360" x2="320" y2="308" stroke="#8fbf7a" stroke-width="1.6" opacity=".5"/><circle cx="320" cy="308" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="320" cy="308" r="7" fill="#8fbf7a" opacity=".55"/><line x1="455" y1="360" x2="455" y2="412" stroke="#e0b45f" stroke-width="1.6" opacity=".5"/><circle cx="455" cy="412" r="14" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="455" cy="412" r="7" fill="#e0b45f" opacity=".55"/><line x1="545" y1="360" x2="545" y2="412" stroke="#e0b45f" stroke-width="1.6" opacity=".5"/><circle cx="545" cy="412" r="14" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="545" cy="412" r="7" fill="#e0b45f" opacity=".55"/><line x1="620" y1="360" x2="620" y2="308" stroke="#e0b45f" stroke-width="1.6" opacity=".5"/><circle cx="620" cy="308" r="14" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="620" cy="308" r="7" fill="#e0b45f" opacity=".55"/><line x1="755" y1="360" x2="755" y2="412" stroke="#d0604a" stroke-width="1.6" opacity=".5"/><circle cx="755" cy="412" r="14" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="755" cy="412" r="7" fill="#d0604a" opacity=".55"/><line x1="870" y1="360" x2="870" y2="308" stroke="#d0604a" stroke-width="1.6" opacity=".5"/><circle cx="870" cy="308" r="14" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="870" cy="308" r="7" fill="#d0604a" opacity=".55"/><g><polygon points="370,343 386,360 370,377 354,360" fill="#c9a45c" opacity=".9"/><text x="370" y="394" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle">隘口一</text></g><g><polygon points="670,343 686,360 670,377 654,360" fill="#c9a45c" opacity=".9"/><text x="670" y="394" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle">隘口二</text></g><g><circle cx="112" cy="360" r="13" fill="#63cbb0"/><text x="112" y="338" fill="#63cbb0" font-size="12.5" font-weight="700" text-anchor="middle">出生</text></g><text x="960" y="365" fill="#d0604a" font-size="14" font-weight="700">终局</text><text x="70" y="525" fill="#7d8f80" font-size="13">清理数：2 / 2 / 2　主路必经，支线窝点可跳过</text><text x="70" y="545" fill="#7d8f80" font-size="13"></text><text x="70" y="565" fill="#7d8f80" font-size="13">优点：深度绝对可读；节奏最容易控制；隘口天然是首领位；美术只需做三段而非一整张</text><text x="70" y="585" fill="#7d8f80" font-size="13">缺点：最不「开放」，回头路无意义；玩家可能感觉是关卡而不是世界</text><text x="70" y="605" fill="#7d8f80" font-size="13"></text><text x="70" y="625" fill="#7d8f80" font-size="13">作者成本：最低　　与里程碑闸门契合度：最高</text><g><rect x="40" y="662" width="1020" height="74" rx="7" fill="#0e1c16" stroke="#22362b"/><circle cx="62" cy="690" r="8" fill="#8fbf7a"/><text x="78" y="695" fill="#7d8f80" font-size="13">一层窝点位 · 核心血量 18–20</text><circle cx="254" cy="690" r="8" fill="#e0b45f"/><text x="270" y="695" fill="#7d8f80" font-size="13">二层窝点位 · 22–26</text><circle cx="446" cy="690" r="8" fill="#d0604a"/><text x="462" y="695" fill="#7d8f80" font-size="13">三层窝点位 · 28–30</text><circle cx="638" cy="690" r="8" fill="#c9a45c"/><text x="654" y="695" fill="#7d8f80" font-size="13">区域首领 / 过渡点</text><circle cx="830" cy="690" r="8" fill="#63cbb0"/><text x="846" y="695" fill="#7d8f80" font-size="13">出生点</text><text x="62" y="724" fill="#7d8f80" font-size="12.5">窝点从同层候选位中随机抽取，所以两局路线不同。数字标注为该区域需清理的窝点数。</text></g></svg>