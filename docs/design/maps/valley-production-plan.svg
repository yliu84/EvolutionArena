<text x="135.5" y="424" fill="#e6efe4" font-size="12" text-anchor="middle">200 世界单位 ≈ 32 秒全速奔跑</text>
<text x="42" y="500.0" fill="#7d8f80" font-size="12.5">时间预算（推导长度的依据，非事后填数）：</text>
<text x="42" y="518.5" fill="#7d8f80" font-size="12.5">6 窝点 × 110s + 2 首领 × 70s + Boss 110s + 7 次选择面板 × 15s = 1015s 战斗与选择</text>
<text x="42" y="537.0" fill="#7d8f80" font-size="12.5">25 分钟 − 1015s = 485s 移动 → 路径 2105 单位（速度 6.2，路径效率 70%）</text>
<text x="42" y="555.5" fill="#7d8f80" font-size="12.5">减去支线往返 540 → 主路单程 1565 ≈ 本图的 1600</text>
<text x="42" y="574.0" fill="#7d8f80" font-size="12.5"></text>
<text x="42" y="592.5" fill="#7d8f80" font-size="12.5">窝点：每区 3 个候选位，实际只激活 2 个。位置与原型都随机——三层原型只有 2 个，靠位置随机保证路线仍有变化。</text>
<text x="42" y="611.0" fill="#7d8f80" font-size="12.5">隘口：半宽收窄到 26（玩家碰撞半径约 1.5），物理上无法绕过，天然是区域首领位与变异里程碑点。</text>
<text x="42" y="629.5" fill="#7d8f80" font-size="12.5">补给点 R1 / R2：位于隘口前，用于「每进入新区域补 1 条命」与区域检查点。</text>
