<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="Helvetica,Arial,sans-serif">
<rect width="1100" height="780" fill="#0a1410"/>
<text x="40" y="52" fill="#e6efe4" font-size="27" font-weight="700">方案 D · 群岛</text>
<text x="40" y="80" fill="#7d8f80" font-size="15">区域是岛，岛之间是窄渡口，渡口即首领关。</text>
<rect x="40" y="108" width="1020" height="392" rx="12" fill="#0b1a20" opacity=".5"/><circle cx="215" cy="262" r="130" fill="#12241a" stroke="#8fbf7a" stroke-width="2"/><text x="215" y="119" fill="#8fbf7a" font-size="13.5" font-weight="700" text-anchor="middle">岛一</text><circle cx="168.22742330615634" cy="209.65149410519422" r="12" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="168.22742330615634" cy="209.65149410519422" r="5" fill="#8fbf7a" opacity=".55"/><circle cx="258.63701977260064" cy="207.01045094415065" r="12" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="258.63701977260064" cy="207.01045094415065" r="5" fill="#8fbf7a" opacity=".55"/><circle cx="276.60629584470416" cy="295.65567281001506" r="12" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="276.60629584470416" cy="295.65567281001506" r="5" fill="#8fbf7a" opacity=".55"/><circle cx="192.30507240618206" cy="328.4302661556565" r="12" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="192.30507240618206" cy="328.4302661556565" r="5" fill="#8fbf7a" opacity=".55"/><circle cx="548" cy="372" r="112" fill="#12241a" stroke="#e0b45f" stroke-width="2"/><text x="548" y="247" fill="#e0b45f" font-size="13.5" font-weight="700" text-anchor="middle">岛二</text><circle cx="507.7036262329962" cy="326.89974876755196" r="12" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="507.7036262329962" cy="326.89974876755196" r="5" fill="#e0b45f" opacity=".55"/><circle cx="585.5949708810098" cy="324.6243885057298" r="12" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="585.5949708810098" cy="324.6243885057298" r="5" fill="#e0b45f" opacity=".55"/><circle cx="601.0761933431297" cy="400.9956565747822" r="12" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="601.0761933431297" cy="400.9956565747822" r="5" fill="#e0b45f" opacity=".55"/><circle cx="528.4474469960953" cy="429.23222930333486" r="12" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="528.4474469960953" cy="429.23222930333486" r="5" fill="#e0b45f" opacity=".55"/><circle cx="838" cy="244" r="100" fill="#12241a" stroke="#d0604a" stroke-width="2"/><text x="838" y="131" fill="#d0604a" font-size="13.5" font-weight="700" text-anchor="middle">岛三</text><circle cx="802.0210948508895" cy="203.7319185424571" r="12" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="802.0210948508895" cy="203.7319185424571" r="5" fill="#d0604a" opacity=".55"/><circle cx="871.5669382866158" cy="201.7003468801159" r="12" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="871.5669382866158" cy="201.7003468801159" r="5" fill="#d0604a" opacity=".55"/><circle cx="885.3894583420802" cy="269.88897908462695" r="12" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="885.3894583420802" cy="269.88897908462695" r="5" fill="#d0604a" opacity=".55"/><circle cx="820.5423633893708" cy="295.10020473512037" r="12" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="820.5423633893708" cy="295.10020473512037" r="5" fill="#d0604a" opacity=".55"/><path d="M336,308 Q420,352 442,356" stroke="#c9a45c" stroke-width="7" fill="none" opacity=".5"/><path d="M654,338 Q730,272 742,266" stroke="#c9a45c" stroke-width="7" fill="none" opacity=".5"/><g><polygon points="390,319 406,336 390,353 374,336" fill="#c9a45c" opacity=".9"/><text x="390" y="370" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle">渡口一</text></g><g><polygon points="700,283 716,300 700,317 684,300" fill="#c9a45c" opacity=".9"/><text x="700" y="334" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle">渡口二</text></g><g><circle cx="112" cy="300" r="13" fill="#63cbb0"/><text x="112" y="278" fill="#63cbb0" font-size="12.5" font-weight="700" text-anchor="middle">出生</text></g><text x="60" y="556" fill="#7d8f80" font-size="13">清理数：2 / 2 / 2</text><text x="60" y="576" fill="#7d8f80" font-size="13">优点：区域边界物理上无法绕过；水域主题直接对应沉没母巢与重甲泥盆；三岛可各有独立地貌</text><text x="60" y="596" fill="#7d8f80" font-size="13">缺点：渡口是纯移动时间，容易变成无内容的走路；三张岛等于三张小地图的美术量</text><text x="60" y="616" fill="#7d8f80" font-size="13">作者成本：最高　　视觉辨识度：最高</text><g><rect x="40" y="662" width="1020" height="74" rx="7" fill="#0e1c16" stroke="#22362b"/><circle cx="62" cy="690" r="8" fill="#8fbf7a"/><text x="78" y="695" fill="#7d8f80" font-size="13">一层窝点位 · 核心血量 18–20</text><circle cx="254" cy="690" r="8" fill="#e0b45f"/><text x="270" y="695" fill="#7d8f80" font-size="13">二层窝点位 · 22–26</text><circle cx="446" cy="690" r="8" fill="#d0604a"/><text x="462" y="695" fill="#7d8f80" font-size="13">三层窝点位 · 28–30</text><circle cx="638" cy="690" r="8" fill="#c9a45c"/><text x="654" y="695" fill="#7d8f80" font-size="13">区域首领 / 过渡点</text><circle cx="830" cy="690" r="8" fill="#63cbb0"/><text x="846" y="695" fill="#7d8f80" font-size="13">出生点</text><text x="62" y="724" fill="#7d8f80" font-size="12.5">窝点从同层候选位中随机抽取，所以两局路线不同。数字标注为该区域需清理的窝点数。</text></g></svg>