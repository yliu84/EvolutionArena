<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="Helvetica,Arial,sans-serif">
<rect width="1100" height="780" fill="#0a1410"/>
<text x="40" y="52" fill="#e6efe4" font-size="27" font-weight="700">方案 B · 中枢三叶</text>
<text x="40" y="80" fill="#7d8f80" font-size="15">中枢连接三片区域，玩家自己决定先去哪一片。</text>
<line x1="328.58667479786317" y1="341.06991769071215" x2="294.31112466310526" y2="320.44986281785356" stroke="#8fbf7a" stroke-width="3" opacity=".5"/><circle cx="212.04980433968632" cy="270.961731122993" r="96" fill="none" stroke="#8fbf7a" stroke-width="1.7" stroke-dasharray="7 6" opacity=".62"/><text x="200" y="158" fill="#8fbf7a" font-size="13.5" font-weight="700" text-anchor="middle">叶一</text><circle cx="167.73959904335004" cy="301.8260423350796" r="13" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="167.73959904335004" cy="301.8260423350796" r="6" fill="#8fbf7a" opacity=".55"/><circle cx="165.77781165776315" cy="243.12465704463392" r="13" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="165.77781165776315" cy="243.12465704463392" r="6" fill="#8fbf7a" opacity=".55"/><circle cx="218.5569538855241" cy="217.35522960696323" r="13" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="218.5569538855241" cy="217.35522960696323" r="6" fill="#8fbf7a" opacity=".55"/><g><polygon points="294.31112466310526,303.4498628178536 310.31112466310526,320.4498628178536 294.31112466310526,337.4498628178536 278.31112466310526,320.4498628178536" fill="#c9a45c" opacity=".9"/><text x="294.31112466310526" y="354.4498628178536" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle"></text></g><line x1="432.65495371342234" y1="343.2344676837478" x2="467.75825618903724" y2="324.0574461395797" stroke="#e0b45f" stroke-width="3" opacity=".5"/><circle cx="552.006182130513" cy="278.0325944335762" r="96" fill="none" stroke="#e0b45f" stroke-width="1.7" stroke-dasharray="7 6" opacity=".62"/><text x="552" y="166" fill="#e0b45f" font-size="13.5" font-weight="700" text-anchor="middle">叶二</text><circle cx="547.7336541349493" cy="224.2018828970646" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="547.7336541349493" cy="224.2018828970646" r="6" fill="#e0b45f" opacity=".55"/><circle cx="599.3956404725932" cy="252.14361534894925" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="599.3956404725932" cy="252.14361534894925" r="6" fill="#e0b45f" opacity=".55"/><circle cx="594.994707252162" cy="310.71266034332234" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="594.994707252162" cy="310.71266034332234" r="6" fill="#e0b45f" opacity=".55"/><g><polygon points="467.7582561890373,307.0574461395797 483.7582561890373,324.0574461395797 467.7582561890373,341.0574461395797 451.7582561890373,324.0574461395797" fill="#c9a45c" opacity=".9"/><text x="467.7582561890373" y="358.0574461395797" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle"></text></g><line x1="377.04897068514975" y1="431.9273846082314" x2="375.966926603038" y2="453.90075896458296" stroke="#d0604a" stroke-width="3" opacity=".5"/><circle cx="371.24527969927766" cy="549.7845743377533" r="96" fill="none" stroke="#d0604a" stroke-width="1.7" stroke-dasharray="7 6" opacity=".62"/><text x="248" y="556" fill="#d0604a" font-size="13.5" font-weight="700" text-anchor="end">叶三</text><circle cx="419.3899672618254" cy="574.2404337482229" r="13" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="419.3899672618254" cy="574.2404337482229" r="6" fill="#d0604a" opacity=".55"/><circle cx="368.58935331591243" cy="603.7192204851616" r="13" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="368.58935331591243" cy="603.7192204851616" r="6" fill="#d0604a" opacity=".55"/><circle cx="320.93076699369476" cy="569.3919660867783" r="13" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="320.93076699369476" cy="569.3919660867783" r="6" fill="#d0604a" opacity=".55"/><g><polygon points="375.08161780858296,454.8789743470524 391.08161780858296,471.8789743470524 375.08161780858296,488.8789743470524 359.08161780858296,471.8789743470524" fill="#c9a45c" opacity=".9"/><text x="375.08161780858296" y="505.8789743470524" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle"></text></g><circle cx="380" cy="372" r="60" fill="#132419" stroke="#c9a45c" stroke-width="2"/><text x="380" y="302" fill="#c9a45c" font-size="13.5" font-weight="700" text-anchor="middle">中枢 · 安全区</text><g><circle cx="380" cy="378" r="13" fill="#63cbb0"/><text x="380" y="356" fill="#63cbb0" font-size="12.5" font-weight="700" text-anchor="middle">出生</text></g><text x="700" y="150" fill="#7d8f80" font-size="13">清理数：每叶 2，共 6</text><text x="700" y="170" fill="#7d8f80" font-size="13"></text><text x="700" y="190" fill="#7d8f80" font-size="13">优点</text><text x="700" y="210" fill="#7d8f80" font-size="13">· 玩家有路线选择权，重玩差异最大</text><text x="700" y="230" fill="#7d8f80" font-size="13">· 三叶可各有主题与配色</text><text x="700" y="250" fill="#7d8f80" font-size="13">· 中枢是天然的安全区 / 补给点</text><text x="700" y="270" fill="#7d8f80" font-size="13"></text><text x="700" y="290" fill="#7d8f80" font-size="13">缺点</text><text x="700" y="310" fill="#7d8f80" font-size="13">· 深度不可读：任意顺序会让</text><text x="700" y="330" fill="#7d8f80" font-size="13">  「越往后越难」失效</text><text x="700" y="350" fill="#7d8f80" font-size="13">· 需要给叶排难度，或按进入顺序</text><text x="700" y="370" fill="#7d8f80" font-size="13">  动态缩放敌人强度（复杂）</text><text x="700" y="390" fill="#7d8f80" font-size="13"></text><text x="700" y="410" fill="#7d8f80" font-size="13">作者成本：中</text><text x="700" y="430" fill="#7d8f80" font-size="13">与里程碑闸门冲突最大</text><g><rect x="40" y="662" width="1020" height="74" rx="7" fill="#0e1c16" stroke="#22362b"/><circle cx="62" cy="690" r="8" fill="#8fbf7a"/><text x="78" y="695" fill="#7d8f80" font-size="13">一层窝点位 · 核心血量 18–20</text><circle cx="254" cy="690" r="8" fill="#e0b45f"/><text x="270" y="695" fill="#7d8f80" font-size="13">二层窝点位 · 22–26</text><circle cx="446" cy="690" r="8" fill="#d0604a"/><text x="462" y="695" fill="#7d8f80" font-size="13">三层窝点位 · 28–30</text><circle cx="638" cy="690" r="8" fill="#c9a45c"/><text x="654" y="695" fill="#7d8f80" font-size="13">区域首领 / 过渡点</text><circle cx="830" cy="690" r="8" fill="#63cbb0"/><text x="846" y="695" fill="#7d8f80" font-size="13">出生点</text><text x="62" y="724" fill="#7d8f80" font-size="12.5">窝点从同层候选位中随机抽取，所以两局路线不同。数字标注为该区域需清理的窝点数。</text></g></svg>