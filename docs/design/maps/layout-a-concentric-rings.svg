<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="Helvetica,Arial,sans-serif">
<rect width="1100" height="780" fill="#0a1410"/>
<text x="40" y="52" fill="#e6efe4" font-size="27" font-weight="700">方案 A · 同心三环</text>
<text x="40" y="80" fill="#7d8f80" font-size="15">深度就是「往中心走」。区域边界是环之间的关口。</text>
<circle cx="440" cy="358" r="248" fill="none" stroke="#8fbf7a" stroke-width="1.6" stroke-dasharray="7 6" opacity=".65"/><text x="440" y="100" fill="#8fbf7a" font-size="13" font-weight="600" text-anchor="middle">区域一</text><circle cx="440" cy="358" r="166" fill="none" stroke="#e0b45f" stroke-width="1.6" stroke-dasharray="7 6" opacity=".65"/><text x="440" y="182" fill="#e0b45f" font-size="13" font-weight="600" text-anchor="middle">区域二</text><circle cx="440" cy="358" r="88" fill="none" stroke="#d0604a" stroke-width="1.6" stroke-dasharray="7 6" opacity=".65"/><text x="440" y="260" fill="#d0604a" font-size="13" font-weight="600" text-anchor="middle">区域三</text><circle cx="524.5569002630206" cy="169.05786436607215" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="524.5569002630206" cy="169.05786436607215" r="7" fill="#8fbf7a" opacity=".55"/><circle cx="645.9658622125513" cy="337.33448275410655" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="645.9658622125513" cy="337.33448275410655" r="7" fill="#8fbf7a" opacity=".55"/><circle cx="560.4083995190239" cy="526.3770094914004" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="560.4083995190239" cy="526.3770094914004" r="7" fill="#8fbf7a" opacity=".55"/><circle cx="344.5579528850204" cy="541.6840103071088" r="14" fill="none" stroke="#8fbf7a" stroke-width="2.4"/><circle cx="344.5579528850204" cy="541.6840103071088" r="7" fill="#8fbf7a" opacity=".55"/><circle cx="341.41039948194464" cy="276.36611812678353" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="341.41039948194464" cy="276.36611812678353" r="6" fill="#e0b45f" opacity=".55"/><circle cx="468.0328559479093" cy="233.10741019818764" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="468.0328559479093" cy="233.10741019818764" r="6" fill="#e0b45f" opacity=".55"/><circle cx="560.2397072444645" cy="401.89091935429775" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="560.2397072444645" cy="401.89091935429775" r="6" fill="#e0b45f" opacity=".55"/><circle cx="442.6617379587958" cy="485.9723218162377" r="13" fill="none" stroke="#e0b45f" stroke-width="2.4"/><circle cx="442.6617379587958" cy="485.9723218162377" r="6" fill="#e0b45f" opacity=".55"/><circle cx="423.1889425230978" cy="308.79239544025444" r="12" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="423.1889425230978" cy="308.79239544025444" r="5" fill="#d0604a" opacity=".55"/><circle cx="472.32371835007456" cy="398.73299930062916" r="12" fill="none" stroke="#d0604a" stroke-width="2.4"/><circle cx="472.32371835007456" cy="398.73299930062916" r="5" fill="#d0604a" opacity=".55"/><g><polygon points="575.1038238059806,244.54816335080739 591.1038238059806,261.5481633508074 575.1038238059806,278.5481633508074 559.1038238059806,261.5481633508074" fill="#c9a45c" opacity=".9"/><text x="575.1038238059806" y="295.5481633508074" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle">关口一</text></g><g><polygon points="378.1612492439273,403.6096550455943 394.1612492439273,420.6096550455943 378.1612492439273,437.6096550455943 362.1612492439273,420.6096550455943" fill="#c9a45c" opacity=".9"/><text x="378.1612492439273" y="454.6096550455943" fill="#c9a45c" font-size="12" font-weight="600" text-anchor="middle">关口二</text></g><g><circle cx="440" cy="634" r="13" fill="#63cbb0"/><text x="440" y="612" fill="#63cbb0" font-size="12.5" font-weight="700" text-anchor="middle">出生</text></g><text x="760" y="150" fill="#7d8f80" font-size="13">清理数：2 / 2 / 2</text><text x="760" y="170" fill="#7d8f80" font-size="13"></text><text x="760" y="190" fill="#7d8f80" font-size="13">优点</text><text x="760" y="210" fill="#7d8f80" font-size="13">· 深度一眼可读：越靠中心越危险</text><text x="760" y="230" fill="#7d8f80" font-size="13">· 迷雾与视野半径天然适配环形</text><text x="760" y="250" fill="#7d8f80" font-size="13">· 只需 2 个关口就分出 3 个区域</text><text x="760" y="270" fill="#7d8f80" font-size="13"></text><text x="760" y="290" fill="#7d8f80" font-size="13">缺点</text><text x="760" y="310" fill="#7d8f80" font-size="13">· 环形移动重复，绕圈感强</text><text x="760" y="330" fill="#7d8f80" font-size="13">· 外环周长最长而危险最低，</text><text x="760" y="350" fill="#7d8f80" font-size="13">  玩家在最无聊的地方走最多路</text><text x="760" y="370" fill="#7d8f80" font-size="13"></text><text x="760" y="390" fill="#7d8f80" font-size="13">作者成本：低</text><text x="760" y="410" fill="#7d8f80" font-size="13">几何最规整，但探索感最弱</text><g><rect x="40" y="662" width="1020" height="74" rx="7" fill="#0e1c16" stroke="#22362b"/><circle cx="62" cy="690" r="8" fill="#8fbf7a"/><text x="78" y="695" fill="#7d8f80" font-size="13">一层窝点位 · 核心血量 18–20</text><circle cx="254" cy="690" r="8" fill="#e0b45f"/><text x="270" y="695" fill="#7d8f80" font-size="13">二层窝点位 · 22–26</text><circle cx="446" cy="690" r="8" fill="#d0604a"/><text x="462" y="695" fill="#7d8f80" font-size="13">三层窝点位 · 28–30</text><circle cx="638" cy="690" r="8" fill="#c9a45c"/><text x="654" y="695" fill="#7d8f80" font-size="13">区域首领 / 过渡点</text><circle cx="830" cy="690" r="8" fill="#63cbb0"/><text x="846" y="695" fill="#7d8f80" font-size="13">出生点</text><text x="62" y="724" fill="#7d8f80" font-size="12.5">窝点从同层候选位中随机抽取，所以两局路线不同。数字标注为该区域需清理的窝点数。</text></g></svg>